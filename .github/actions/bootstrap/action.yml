name: Bootstrap CI environment
description: Standardized repository setup for CI.

runs:
  using: composite
  steps:
    - name: Install verified Node.js and enable Corepack
      shell: bash
      run: |
        version=22.23.4
        archive="node-v${version}-linux-x64.tar.xz"
        install_dir="$(mktemp -d "${RUNNER_TEMP}/governor-node.XXXXXXXX")"
        curl --fail --silent --show-error --location \
          "https://nodejs.org/dist/v${version}/${archive}" \
          --output "${install_dir}/${archive}"
        printf '%s  %s\n' \
          1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce \
          "${install_dir}/${archive}" | sha256sum --check
        tar -xJf "${install_dir}/${archive}" -C "${install_dir}"
        node_bin="${install_dir}/node-v${version}-linux-x64/bin"
        PATH="${node_bin}:${PATH}" corepack enable --install-directory "${node_bin}" pnpm
        printf '%s\n' "${node_bin}" >> "${GITHUB_PATH}"

    - name: Install dependencies
      run: pnpm install
      shell: bash
