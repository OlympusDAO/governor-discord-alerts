blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Reviewed security patch needed for @google-cloud/storage retry-request path.
  - "form-data@2.5.6"
  # Reviewed security patch for query-string parsing denial of service.
  - "qs@6.16.0"
nodeLinker: hoisted
allowBuilds:
  "@parcel/watcher": false
  "unrs-resolver": false
overrides:
  # Keep CloudEvents' CommonJS UUID API while patching its older dependency.
  "cloudevents>uuid@>=8.0.0 <11.1.1": "11.1.1"
  # Preserve YAML 3 semantics; argparse 2's v1 compatibility API drops sprintf-js.
  "js-yaml@>=3.0.0 <4.0.0>argparse@>=1.0.0 <2.0.0": "2.0.1"
packages:
  - "."
preferFrozenLockfile: true
strictDepBuilds: true
